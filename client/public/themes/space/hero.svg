  <defs>
    <radialGradient id="space-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b112c"/>
      <stop offset="60%" stop-color="#040714"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <radialGradient id="nebula-violet" cx="25%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#040714" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-cyan" cx="80%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#040714" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-rose" cx="60%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#040714" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="star-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

